name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Um push novo cancela a execução anterior da mesma branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint e testes
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      # O prisma.config.ts exige a variável até para gerar o client
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/space_booking_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/space_booking_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: space_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t space-booking-api .
